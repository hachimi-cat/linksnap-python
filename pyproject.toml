[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forjio-linksnap"
version = "0.1.1"
description = "Official Python SDK for LinkSnap — short links, QR codes, click analytics, custom domains, workspaces, and billing with Huudis OIDC device-flow auth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["linksnap", "url-shortener", "qr", "analytics", "huudis", "forjio"]
authors = [{ name = "Forjio", email = "hello@forjio.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://linksnap.forjio.com"
Source = "https://github.com/hachimi-cat/linksnap-python"
Issues = "https://github.com/hachimi-cat/linksnap-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["forjio_linksnap"]
